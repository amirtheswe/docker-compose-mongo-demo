services:
  my-app:
    image: amirtheswe/docker-compose-mongo-demo:latest
    restart: unless-stopped
    ports:
      - "80:3000"
    environment:
      MONGO_DB_USERNAME: ${MONGO_USER}
      MONGO_DB_PWD: ${MONGO_PASSWORD}
    depends_on:
      - mongodb

  mongodb:
    image: mongo:7
    restart: unless-stopped
    # No ports section: only the other containers can reach the database.
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db

  mongo-express:
    image: mongo-express
    restart: unless-stopped
    # Bound to the server itself, so it is only reachable through an SSH tunnel.
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD}
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_USER}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_PASSWORD}
    depends_on:
      - mongodb

volumes:
  mongo-data:
